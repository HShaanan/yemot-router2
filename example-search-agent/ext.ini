; ============================================================
;  ext.ini  -  שלוחה מספר 1  -  שלוחת ניתוב API ל-yemot-router2
; ============================================================
;
;  מומלץ ליצור/לערוך את זה דרך ממשק הניהול של ימות:
;    הגדרות שלוחה 1  ->  סוג שלוחה: "ניתוב API"  ->  הזנת כתובת ה-API.
;  הממשק כותב בעצמו את שורת ה-type= הנכונה. הקובץ כאן הוא לעיון/גיבוי.
;
;  שורות שצריך שיהיו בשלוחה (החלף את הדומיין בכתובת השרת הציבורית שלך):

api_url=https://YOUR-SERVER-DOMAIN/

;  כדי שהפרמטרים יישלחו ב-POST (כך השרת בדוגמה מצפה, עם express.urlencoded):
api_url_post=yes

;  הערות:
;  - אל תגדיר api_hangup_send=no  (פוגע בזיכרון; ראה README).
;  - את קובץ ההקלטה שיושמע בכניסה יש להעלות לשלוחה 1 בשם 000.wav
;    (הקוד מפנה אליו כ-"000", בלי סיומת).
;  - אין צורך להגדיר כאן תפריטים/שלבים - כל הלוגיקה היא בקוד השרת.
